name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            script: build:mac:arm64
          - arch: x64
            target: x86_64-apple-darwin
            script: build:mac:x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS ${{ matrix.arch }}
        run: pnpm ${{ matrix.script }}

      - name: Zip macOS app bundle
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent TinyPress.app TinyPress_${{ matrix.arch }}.app.zip

      - name: Upload macOS ${{ matrix.arch }} artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip

  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm build:win

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux
        run: pnpm build:linux

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  notify:
    name: Send build notification
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-win
      - build-linux
    if: always()
    env:
      SERVER_CHAN_SENDKEY: ${{ secrets.SERVER_CHAN_SENDKEY }}
    steps:
      - name: Send ServerChan notification
        if: env.SERVER_CHAN_SENDKEY != ''
        env:
          BUILD_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          TAG_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$BUILD_RESULT" in
            success) STATUS_TEXT="完成" ;;
            failure) STATUS_TEXT="失败" ;;
            cancelled) STATUS_TEXT="已取消" ;;
            *) STATUS_TEXT="$BUILD_RESULT" ;;
          esac

          TITLE="TinyPress ${TAG_NAME} 打包${STATUS_TEXT}"
          DESP="$(printf '仓库：%s\n标签：%s\n结果：%s\n详情：%s' \
            "${GITHUB_REPOSITORY}" \
            "${TAG_NAME}" \
            "${STATUS_TEXT}" \
            "${RUN_URL}")"

          curl --fail-with-body --get \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${DESP}" \
            "https://sctapi.ftqq.com/${SERVER_CHAN_SENDKEY}.send"
