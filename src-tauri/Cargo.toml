[package]
name = "tiny-app"
version = "2.0.0"
description = "A Tauri desktop utility for TinyPNG and audio compression"
authors = ["taosiqi"]
edition = "2021"

[lib]
name = "tiny_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process"] }
urlencoding = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
